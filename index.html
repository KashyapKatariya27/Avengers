<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore beautiful destinations around the world.">
    <title>Travel — Must See Places</title>
    <link rel="stylesheet" href="vercel.css">
</head>
<body>

    <div class="page">

        <header class="nav">
            <div class="logo">travel.</div>
            <div class="nav-tag">Card slider for wordpress</div>
            <nav class="nav-links">
                <a href="#about">About</a>
                <a href="mailto:hello@example.com">Contact</a>
            </nav>
        </header>

        <main class="hero" id="about">
            <div class="hero-copy">
                <h1>Must see</h1>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Proin elementum metus eu enim rhoncus posuere.</p>
                <button class="explore-btn" type="button" onclick="document.querySelector('.slider').scrollIntoView({ behavior: 'smooth', block: 'center' })">Explore</button>
            </div>

            <div class="slider" aria-label="Featured destinations">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1641128324972-af3212f0f6bd?w=600&q=80" alt="Cappadocia hot air balloons">
                    <div class="card-info">
                        <h2>Cappadocia</h2>
                        <span>📍 Turkey</span>
                    </div>
                </div>

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1613395877344-13d4a8e0d49e?w=600&q=80" alt="Santorini steps">
                    <div class="card-info">
                        <h2>Santorini</h2>
                        <span>📍 Greece</span>
                    </div>
                </div>

                <div class="card">
                   <img src="https://images.unsplash.com/photo-1573790387438-4da905039392?w=600&q=80" alt="Bali coastline">
                   <div class="card-info">
                     <h2>Bali</h2>
                     <span>📍 Indonesia</span>
                   </div>
                </div>
            </div>
        </main>

        <footer class="bottom-bar">
            <div class="socials" aria-label="Social links">
                  <a href="https://facebook.com" aria-label="Facebook">f</a>
                  <a href="https://youtube.com" aria-label="YouTube">▶</a>
                  <a href="https://instagram.com" aria-label="Instagram">◧</a>
            </div>
            <div class="footer-tag">Unique destinations</div>
            <div class="pager">
                <span class="pager-count" aria-live="polite">01 / 03</span>
                <button class="arrow" id="prevArrow" type="button" aria-label="Previous destination">‹</button>
                <button class="arrow" id="nextArrow" type="button" aria-label="Next destination">›</button>
            </div>
        </footer>

    </div>

    <script src="vercel.js"></script>
</body>
</html>
